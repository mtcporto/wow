<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>World of Warcraft - Classes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('https://bnetcmsus-a.akamaihd.net/cms/template_resource/fh/FHSCSCG9CXOC1462229977849.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #f8f8f8;
      padding: 20px;
      margin: 0;
      position: relative;
      min-height: 100vh;
    }
    
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: -1;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    
    h1 {
      font-family: 'Cinzel', serif;
      color: #ffc000;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      text-align: center;
      font-size: 3em;
      margin-bottom: 30px;
      letter-spacing: 1px;
      border-bottom: 2px solid #825b00;
      padding-bottom: 15px;
    }
    
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    
    .class-card {
      border: 2px solid #825b00;
      border-radius: 8px;
      padding: 15px;
      background: linear-gradient(to bottom, #3a2e25, #1a1410);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
      overflow: hidden;
    }
    
    .class-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
    }
    
    .class-card strong {
      font-family: 'Cinzel', serif;
      color: #ffc000;
      font-size: 1.3em;
      display: block;
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }
    
    .class-card img {
      width: 64px;
      height: 64px;
      margin-bottom: 10px;
    }
    
    .class-desc {
      font-size: 0.85em;
      color: #d4d4d4;
      margin-top: 8px;
      line-height: 1.4;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      font-family: 'Cinzel', serif;
      color: #ffc000;
      font-size: 1.5em;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }
    
    .error {
      background: rgba(139, 0, 0, 0.7);
      border: 1px solid #ff0000;
      color: #ffffff;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
      margin: 20px auto;
      max-width: 80%;
    }
    
    .api-warning {
      background: rgba(139, 0, 0, 0.7);
      border: 1px solid #ff0000;
      color: #ffffff;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
      margin: 20px auto;
      max-width: 80%;
      font-size: 0.9em;
    }
    
    .api-warning a {
      color: #ffc000;
      text-decoration: none;
    }
    
    .api-warning a:hover {
      text-decoration: underline;
    }
    
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
      flex-wrap: wrap;
    }
    
    .language-selector {
      display: flex;
      border: 1px solid #825b00;
      border-radius: 5px;
      overflow: hidden;
    }
    
    .language-btn {
      background-color: #3a2e25;
      border: none;
      color: #d4d4d4;
      padding: 8px 15px;
      cursor: pointer;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.2s;
    }
    
    .language-btn:hover {
      background-color: #4d3e33;
    }
    
    .language-btn.active {
      background-color: #825b00;
      color: #fff;
    }
    
    .feature-selector {
      display: flex;
      flex-direction: column;
      margin-top: 30px;
      background: rgba(58, 46, 37, 0.8);
      border: 1px solid #825b00;
      border-radius: 8px;
      padding: 15px;
    }
    
    .feature-selector h3 {
      font-family: 'Cinzel', serif;
      color: #ffc000;
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 1.2em;
      text-align: center;
    }
    
    .feature-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    
    .feature-btn {
      background: linear-gradient(to bottom, #825b00, #5d4000);
      border: none;
      border-radius: 5px;
      color: #fff;
      padding: 8px 15px;
      cursor: pointer;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.2s;
      font-size: 0.9em;
    }
    
    .feature-btn:hover {
      background: linear-gradient(to bottom, #a67300, #825b00);
    }
    
    .hidden {
      display: none;
    }
    
    .feature-category {
      margin-bottom: 15px;
    }
    
    .category-title {
      color: #ffc000;
      font-family: 'Cinzel', serif;
      margin-bottom: 8px;
      font-size: 1em;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="page-title">Playable Classes (WoW)</h1>
    <div class="controls">
      <div class="language-selector">
        <button id="lang-en" class="language-btn active">English (US)</button>
        <button id="lang-pt" class="language-btn">Português (BR)</button>
      </div>
    </div>
    <div id="output" class="loading">Loading...</div>
    
    <div class="feature-selector hidden" id="feature-selector">
      <h3 id="feature-title">More WoW API Features</h3>
      
      <div class="feature-category">
        <div class="category-title" id="character-title">Character</div>
        <div class="feature-btn-group">
          <button class="feature-btn" data-feature="specializations">Specializations</button>
          <button class="feature-btn" data-feature="talents">Talents</button>
          <button class="feature-btn" data-feature="pvp-talents">PvP Talents</button>
          <button class="feature-btn" data-feature="achievements">Achievements</button>
        </div>
      </div>
      
      <div class="feature-category">
        <div class="category-title" id="game-data-title">Game Data</div>
        <div class="feature-btn-group">
          <button class="feature-btn" data-feature="races">Playable Races</button>
          <button class="feature-btn" data-feature="items">Items</button>
          <button class="feature-btn" data-feature="mounts">Mounts</button>
          <button class="feature-btn" data-feature="pets">Pets</button>
        </div>
      </div>
      
      <div class="feature-category">
        <div class="category-title" id="world-title">World</div>
        <div class="feature-btn-group">
          <button class="feature-btn" data-feature="realms">Realms</button>
          <button class="feature-btn" data-feature="regions">Regions</button>
          <button class="feature-btn" data-feature="dungeons">Dungeons</button>
          <button class="feature-btn" data-feature="raids">Raids</button>
        </div>
      </div>
      
      <div class="feature-category">
        <div class="category-title" id="media-title">Media</div>
        <div class="feature-btn-group">
          <button class="feature-btn" data-feature="class-media">Class Images</button>
          <button class="feature-btn" data-feature="wallpapers">Wallpapers</button>
          <button class="feature-btn" data-feature="cinematics">Cinematics</button>
          <button class="feature-btn" data-feature="screenshots">Screenshots</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Your Blizzard API credentials - remain the same
    const clientId = "6389e5d046fe4fee9608db0cd88b3fc2";
    const clientSecret = "z8KQhty3pXnnyRq8GbN8A6W1tzb1NlpS";
    
    // Default language and getting language from sessionStorage if available
    let currentLanguage = sessionStorage.getItem("wow-language") || "en_US";
    
    // Text translations object
    const translations = {
      "page-title": {
        "en_US": "Playable Classes (WoW)",
        "pt_BR": "Classes Jogáveis (WoW)"
      },
      "loading": {
        "en_US": "Loading...",
        "pt_BR": "Carregando..."
      },
      "summoning": {
        "en_US": "Summoning Azeroth classes...",
        "pt_BR": "Invocando classes de Azeroth..."
      },
      "error-load": {
        "en_US": "Error loading classes: ",
        "pt_BR": "Erro ao carregar classes: "
      },
      "check-credentials": {
        "en_US": "Check your Blizzard API credentials",
        "pt_BR": "Verifique as credenciais da API da Blizzard"
      }
    };
    
    // Get translated text
    function getTranslation(key) {
      return translations[key][currentLanguage] || translations[key]["en_US"];
    }
    
    // Update all page text based on selected language
    function updatePageText() {
      document.getElementById("page-title").textContent = getTranslation("page-title");
      
      const output = document.getElementById("output");
      if (output.className === "loading") {
        output.textContent = getTranslation("loading");
      }
    }
    
    // Update language button UI
    function updateLanguageButtons() {
      document.getElementById("lang-en").classList.toggle("active", currentLanguage === "en_US");
      document.getElementById("lang-pt").classList.toggle("active", currentLanguage === "pt_BR");
      updateFeatureText();
      updatePageText();
    }
    
    // Update feature section text based on language
    function updateFeatureText() {
      const isPortuguese = currentLanguage === "pt_BR";
      
      document.getElementById("feature-title").textContent = isPortuguese ? 
        "Mais recursos da API do WoW" : "More WoW API Features";
      
      document.getElementById("character-title").textContent = isPortuguese ?
        "Personagem" : "Character";
        
      document.getElementById("game-data-title").textContent = isPortuguese ?
        "Dados do Jogo" : "Game Data";
        
      document.getElementById("world-title").textContent = isPortuguese ?
        "Mundo" : "World";
        
      document.getElementById("media-title").textContent = isPortuguese ?
        "Mídia" : "Media";
        
      // Update button text based on language
      const buttonTranslations = {
        "specializations": isPortuguese ? "Especializações" : "Specializations",
        "talents": isPortuguese ? "Talentos" : "Talents",
        "pvp-talents": isPortuguese ? "Talentos JvJ" : "PvP Talents",
        "achievements": isPortuguese ? "Conquistas" : "Achievements",
        "races": isPortuguese ? "Raças Jogáveis" : "Playable Races",
        "items": isPortuguese ? "Itens" : "Items",
        "mounts": isPortuguese ? "Montarias" : "Mounts",
        "pets": isPortuguese ? "Mascotes" : "Pets",
        "realms": isPortuguese ? "Reinos" : "Realms",
        "regions": isPortuguese ? "Regiões" : "Regions",
        "dungeons": isPortuguese ? "Masmorras" : "Dungeons",
        "raids": isPortuguese ? "Raides" : "Raids",
        "class-media": isPortuguese ? "Imagens de Classes" : "Class Images",
        "wallpapers": isPortuguese ? "Papéis de Parede" : "Wallpapers",
        "cinematics": isPortuguese ? "Cinemáticas" : "Cinematics",
        "screenshots": isPortuguese ? "Capturas de Tela" : "Screenshots"
      };
      
      document.querySelectorAll('.feature-btn').forEach(button => {
        const featureKey = button.dataset.feature;
        if (buttonTranslations[featureKey]) {
          button.textContent = buttonTranslations[featureKey];
        }
      });
    }
    
    // Initialize language buttons
    document.getElementById("lang-en").addEventListener("click", () => {
      currentLanguage = "en_US";
      sessionStorage.setItem("wow-language", currentLanguage);
      updateLanguageButtons();
      showClasses(); // Reload with new language
    });
    
    document.getElementById("lang-pt").addEventListener("click", () => {
      currentLanguage = "pt_BR";
      sessionStorage.setItem("wow-language", currentLanguage);
      updateLanguageButtons();
      showClasses(); // Reload with new language
    });
    
    // Set initial button and text states
    updateLanguageButtons();
    
    // Class icon mapping - used to add icons to API data
    const classIconMap = {
      1: "warrior",
      2: "paladin",
      3: "hunter",
      4: "rogue",
      5: "priest",
      6: "deathknight",
      7: "shaman",
      8: "mage",
      9: "warlock",
      10: "monk",
      11: "druid",
      12: "demonhunter",
      13: "evoker"
    };
    
    // Class description mapping - English 
    const classDescriptionsEn = {
      1: "A master of melee combat, using plate armor and various weapons.",
      2: "A holy defender who uses Light magic to heal and protect allies.",
      3: "A ranged combat specialist who masters long-range weapons and animals.",
      4: "A stealthy assassin who specializes in quick attacks and poisons.",
      5: "A devoted healer who also masters shadow magic.",
      6: "A dark warrior who manipulates unholy magic and commands the dead.",
      7: "A spiritual guide who controls the elements and restores allies.",
      8: "An arcane scholar who masters fire, frost and arcane to destroy enemies.",
      9: "A wielder of dark magic who summons demons and curses enemies.",
      10: "A martial arts master who channels vital energy to heal and fight.",
      11: "A guardian of nature who can transform into various animals.",
      12: "An agile hunter who uses demonic powers against enemies.",
      13: "A draconic guardian who manipulates draconic magic to protect and destroy."
    };
    
    // Class description mapping - Portuguese
    const classDescriptionsPt = {
      1: "Um mestre em combate corpo a corpo, utilizando placas e diversas armas.",
      2: "Um defensor sagrado que usa magia da Luz para curar e proteger aliados.",
      3: "Um especialista em combate à distância que domina armas de longo alcance e animais.",
      4: "Um assassino furtivo que se especializa em ataques rápidos e venenos.",
      5: "Um curandeiro devoto que também domina magias das sombras.",
      6: "Um guerreiro sombrio que manipula magia profana e domina os mortos.",
      7: "Um guia espiritual que controla os elementos e restaura aliados.",
      8: "Um estudioso arcano que domina o fogo, gelo e arcano para destruir inimigos.",
      9: "Um praticante de magia sombria que invoca demônios e amaldiçoa inimigos.",
      10: "Um mestre das artes marciais que canaliza a energia vital para curar e lutar.",
      11: "Um guardião da natureza que pode se transformar em diversos animais.",
      12: "Um caçador ágil que usa poderes demoníacos contra seus inimigos.",
      13: "Um guardião draconiano que manipula magia dracônica para proteger e destruir."
    };

    // Check if we have cached data that's not expired
    function getCachedData(key) {
      const stored = sessionStorage.getItem(key);
      if (!stored) return null;
      
      try {
        const { timestamp, data } = JSON.parse(stored);
        // Cache expires after 30 minutes
        if (Date.now() - timestamp < 30 * 60 * 1000) {
          return data;
        }
      } catch (e) {
        console.error("Error parsing cached data:", e);
      }
      return null;
    }
    
    // Save data to cache
    function setCachedData(key, data) {
      try {
        sessionStorage.setItem(key, JSON.stringify({
          timestamp: Date.now(),
          data
        }));
      } catch (e) {
        console.error("Error caching data:", e);
      }
    }

    async function getAccessToken() {
      // Check if we have a cached token that's not expired
      const cachedToken = getCachedData("wow-token");
      if (cachedToken) return cachedToken;
      
      try {
        const credentials = btoa(`${clientId}:${clientSecret}`);
        const response = await fetch("https://oauth.battle.net/token", {
          method: "POST",
          headers: {
            "Authorization": `Basic ${credentials}`,
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: "grant_type=client_credentials"
        });
        
        if (!response.ok) {
          throw new Error(`Falha na autenticação (${response.status}: ${response.statusText})`);
        }
        
        const data = await response.json();
        setCachedData("wow-token", data.access_token);
        return data.access_token;
      } catch (error) {
        console.error("Erro ao obter token:", error);
        throw error;
      }
    }

    async function fetchPlayableClasses(token) {
      const cacheKey = `wow-classes-${currentLanguage}`;
      const cachedData = getCachedData(cacheKey);
      
      if (cachedData) {
        return cachedData;
      }
      
      try {
        const res = await fetch(`https://us.api.blizzard.com/data/wow/playable-class/index?namespace=static-us&locale=${currentLanguage}`, {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });
        
        if (!res.ok) {
          throw new Error(`Falha na API (${res.status}: ${res.statusText})`);
        }
        
        const data = await res.json();
        setCachedData(cacheKey, data);
        return data;
      } catch (error) {
        console.error("Erro na API:", error);
        throw error;
      }
    }

    async function showClasses() {
      const container = document.getElementById("output");
      const featureSelector = document.getElementById("feature-selector");
      
      try {
        container.className = "loading";
        container.textContent = getTranslation("summoning");
        
        // Hide feature selector while loading
        featureSelector.classList.add("hidden");
        
        const token = await getAccessToken();
        const data = await fetchPlayableClasses(token);
        
        container.className = "class-grid";
        container.innerHTML = "";

        data.classes.forEach(cl => {
          const div = document.createElement("div");
          div.className = "class-card";
          div.dataset.classId = cl.id;
          
          let html = `<strong>${cl.name}</strong>`;
          
          // Add icon
          const iconUrl = `https://render.worldofwarcraft.com/us/icons/56/classicon_${classIconMap[cl.id]}.jpg`;
          html += `<img src="${iconUrl}" alt="${cl.name}">`;
          
          // Add description based on language
          const descriptions = currentLanguage === "pt_BR" ? classDescriptionsPt : classDescriptionsEn;
          html += `<p class="class-desc">${descriptions[cl.id]}</p>`;
          
          div.innerHTML = html;
          container.appendChild(div);
        });
        
        // Show feature selector after successful load
        featureSelector.classList.remove("hidden");
        
      } catch (err) {
        container.className = "error";
        container.innerHTML = `
          <p>${getTranslation("error-load")}${err.message}</p>
          <p>${getTranslation("check-credentials")}</p>
        `;
        console.error(err);
      }
    }

    // Initialize feature buttons
    document.querySelectorAll('.feature-btn').forEach(button => {
      button.addEventListener('click', () => {
        const feature = button.dataset.feature;
        
        // Example message for additional features (would be replaced with actual implementations)
        alert(currentLanguage === "pt_BR" ? 
          `Recurso "${button.textContent}" em desenvolvimento. Este recurso permitirá visualizar detalhes adicionais do WoW.` :
          `Feature "${button.textContent}" under development. This feature will allow you to view additional WoW details.`);
      });
    });

    // Start the application
    showClasses();
  </script>
</body>
</html>
